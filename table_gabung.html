<!DOCTYPE html>
<html>
    <head>
        <title>Colspan dan Rowspan</title>
        <link rel="stylesheet" href="table_gabung.css"
    </head>
    <body>
        <h2>Colspan dan Rowspan pada Table</h2>
        <!-- colspan : menggabungkan kolom
           | rowspan : menggabungkan baris -->
        <table>
            <tr>
                <th rowspan="2">No</th>
                <th rowspan="2">Nama</th>
                <th colspan="2">Nilai</th>
            </tr>
            <tr>
                <td>Ulangan 1</td>
                <td>Ulangan 2</td>
            </tr>
            <tr>
                <td>1</td>
                <td>Glori</td>
                <td>90</td>
                <td>93</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Stefani</td>
                <td>88</td>
                <td>92</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Charlotte</td>
                <td>97</td>
                <td>98</td>
            </tr>
            <tr>
                <td>1</td>
                <td>Stacie</td>
                <td>96</td>
                <td>94</td>
            </tr>
            <tr>
                <td>1</td>
                <td>Cleo</td>
                <td>86</td>
                <td>92</td>
            </tr>
        </table>
    </body>
</html>
