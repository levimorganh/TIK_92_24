<!DOCTYPE html>
<html>
    <head>
        <title>Unorderlist</title>
        <style>
            ul{
                list-style-type: circle;
            }
            ol.a{
                list-style: lower-alpha;
            }
            ol{
                background-color: beige;
            }
            ol li{
                background-color: cornsilk;
            }
        </style>
    </head>
    <body>
        <h2>Menu Makanan dan Minuman</h2>
       <p>Makanan</p>
       <ol>
        <li>MCD</li>
        <ul>
            <li>Kentang Goreng</li>
        </ul>
        <li>KFC</li>
        <ol class="a">
            <li>Kentang Goreng</li>

        </ol>

        <li>Nasi Goreng</li>
       </ol>
       <p>Minuman</p>
    <ul>
        <li>Sprite</li>
        <li>Jus</li>
        <li>Air Putih</li>
    </ul>
    <h2>Icon pada HTML</h2>
    </body>
</html>
